<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal - Jobs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">JobPortal</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="jobs.html" class="active">View Jobs</a>
            <a href="add-job.html">Add Job</a>
        </nav>
    </header>

    <main>
        <h1>Job Listings</h1>
        
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search jobs by company or position...">
        </div>

        <div id="jobs-container">
            <p class="no-jobs">No jobs found. <a href="add-job.html">Add your first job!</a></p>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        renderJobs();
        
        document.getElementById('search-input').addEventListener('input', function(e) {
            renderJobs(e.target.value);
        });
    </script>
</body>
</html>
