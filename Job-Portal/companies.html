<!DOCTYPE html>
<html lang="en">

<head>

    <div class="nav">

        

        <div class="links">

            <a href="index.html">Home</a>
            <a href="jobs.html">Jobs</a>
            <a href="postjob.html">Post Job</a>

        </div>

    </div>
    <meta charset="UTF-8">
    <title>Post a Job | JOB PORTAL</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <header>
        <img src="images.png" alt="site logo">
    </header>

    <main>
        <h1 class="page-title">Post a Job</h1>

        <div class="form-container">
            <form>

                <div class="form-group">
                    <label for="job-title">Job Title</label>
                    <input type="text" id="job-title" placeholder="Enter job title">
                </div>

                <div class="form-group">
                    <label for="company-name">Company Name</label>
                    <input type="text" id="company-name" placeholder="Enter company name">
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" placeholder="Enter job location">
                </div>

                <div class="form-group">
                    <label for="salary">Salary (LPA)</label>
                    <input type="text" id="salary" placeholder="Enter salary">
                </div>

                <button type="submit" class="submit-btn">Post Job</button>

            </form>
        </div>
    </main>

    <footer>
        <p>© JOB PORTAL all rights reserved</p>
    </footer>

</body>
</html>
